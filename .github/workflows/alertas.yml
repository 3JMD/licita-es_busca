name: Alertas de licitações
on:
  schedule:
    - cron: '0 11 * * *' # 08:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/alertas.test.mjs
      - run: node scripts/alertas.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publicar cache dos destaques
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/destaques.json
          git diff --cached --quiet || (git commit -m "chore: atualiza cache de destaques" && git push)
