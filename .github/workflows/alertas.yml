name: Alertas de licitações
on:
  schedule:
    - cron: '0 11 * * *' # 08:00 em Brasília
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/alertas.test.mjs
      - run: node scripts/alertas.mjs
        env:
          GH_TOKEN: ${{ github.token }}
